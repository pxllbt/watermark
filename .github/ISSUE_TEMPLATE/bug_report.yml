name: "Bug Report"
description: "Report a Watermark issue"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for flagging something. Check existing issues first if you can.

  - type: textarea
    id: description
    attributes:
      label: What's wrong
      description: Describe the bug.
      placeholder: "When switching workspaces, ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How do you trigger it?
      placeholder: |
        1. Enable pix.watermark
        2. Switch workspaces
        3. See unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: Environment
      description: Output of `hyprctl version` and Omarchy version.
      render: shell
      placeholder: |
        Omarchy: 4.x
        Hyprland: 0.44.0
    validations:
      required: true