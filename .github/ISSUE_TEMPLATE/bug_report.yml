name: "🐛 Bug Report"
description: "File a bug report to help improve Watermark"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When opening a fullscreen application, ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Enable pix.watermark
        2. Switch workspaces
        3. See unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: System Information
      description: Output of `hyprctl version`, `quickshell --version`, and Linux distribution.
      render: shell
      placeholder: |
        Hyprland: 0.44.0
        Quickshell: 0.3.1
        Distro: Arch Linux
    validations:
      required: true
