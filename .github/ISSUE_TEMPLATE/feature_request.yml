name: "Feature Request"
description: "Suggest an idea for Watermark"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Let me know.

  - type: textarea
    id: problem
    attributes:
      label: What you want
      description: What would you like to improve or add?
      placeholder: "I'd like to suggest a..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Details
      description: Anything specific about how it should work.
    validations:
      required: true